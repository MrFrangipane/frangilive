name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libjack-jackd2-dev libasound2-dev libgl1 libegl1 libxkbcommon0
      - name: Install Python dependencies
        run: |
          uv sync --locked --python 3.11
          uv pip install pyinstaller==6.11.1
      - name: Generate application resources
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run --no-sync python -m scripts.make_device_library
          uv run --no-sync python -m scripts.generate_icons
      - name: Build and test JACK matrix
        if: runner.os == 'Linux'
        run: |
          make -C native
          make -C native test
      - name: Build application
        shell: bash
        run: |
          args=(--noconfirm --clean --onedir --contents-directory . --name frangilive-app
                --collect-data frangilive.resources --collect-all pyside6helpers
                --hidden-import mido.backends.rtmidi)
          if [ "$RUNNER_OS" = Linux ]; then
            args+=(--add-binary 'native/jack-matrix:native')
          fi
          uv run --no-sync pyinstaller "${args[@]}" frangilive/ui/__main__.py
          test -f dist/frangilive-app/frangilive/resources/devices.json
          test -f dist/frangilive-app/frangilive/resources/icons/digitakt.svg
          if [ "$RUNNER_OS" = Linux ]; then
            test -x dist/frangilive-app/native/jack-matrix
          fi
      - name: Archive Unix build
        if: runner.os != 'Windows'
        run: tar -czf frangilive-${{ matrix.target }}.tar.gz -C dist frangilive-app
      - name: Archive Windows build
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/frangilive-app -DestinationPath frangilive-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v6
        with:
          name: frangilive-${{ matrix.target }}
          path: frangilive-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true